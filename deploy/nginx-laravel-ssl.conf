# Nginx site config for the Laravel app — HTTPS variant.
# Installed by deploy/setup-vps.sh to /etc/nginx/sites-available/laravel
# instead of nginx-laravel.conf once a certificate for __PRIMARY_DOMAIN__
# already exists on disk. Unlike the old approach (certbot --nginx rewriting
# this file on every deploy), the SSL server block below is self-contained:
# it only reads the certificate that's already on disk and never depends on
# certbot succeeding at deploy time.
# __SERVER_NAME__, __APP_DIR__, __PHP_SOCK__ and __PRIMARY_DOMAIN__ are
# substituted at install time.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Keep ACME HTTP-01 challenges reachable even though everything else
    # on this port redirects to https.
    location /.well-known/acme-challenge/ {
        root __APP_DIR__/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... ssl http2;" — старый (объединённый) синтаксис вместо
    # отдельной директивы "http2 on;": последняя появилась только в nginx
    # 1.25.1, а на сервере стоит более старая версия из репозитория
    # Ubuntu, для которой "http2 on;" — синтаксическая ошибка ("unknown
    # directive"), валящая nginx -t на каждом деплое. Старый синтаксис
    # работает и на новых nginx тоже (просто выдаёт deprecation warning,
    # не ошибку), так что это универсальный вариант для обеих версий.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/letsencrypt/live/__PRIMARY_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PRIMARY_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    root __APP_DIR__/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    # Laravel front controller: everything that is not a real file goes to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
    }

    # Block dotfiles, but keep .well-known reachable for Let's Encrypt
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/laravel-access.log;
    error_log  /var/log/nginx/laravel-error.log;
}
