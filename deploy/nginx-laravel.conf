# Nginx site config for the Laravel app.
# Installed by deploy/setup-vps.sh to /etc/nginx/sites-available/laravel.
# __SERVER_NAME__ and __PHP_SOCK__ are substituted at install time.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root __APP_DIR__/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    # Laravel front controller: everything that is not a real file goes to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
    }

    # Block dotfiles, but keep .well-known reachable for Let's Encrypt
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/laravel-access.log;
    error_log  /var/log/nginx/laravel-error.log;
}
